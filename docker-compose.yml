services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-plenora_cockpit}
      POSTGRES_USER: ${POSTGRES_USER:-plenora_cockpit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - cockpit_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: development
    env_file: .env
    command: >-
      sh -c "alembic upgrade head &&
      python -m app.cli seed-monitoring &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      COCKPIT_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      COCKPIT_MONITORING_ENVIRONMENT_ID: 11111111-1111-4111-8111-111111111111
      COCKPIT_MONITORING_COLLECTOR_ID: 22222222-2222-4222-8222-222222222222
      COCKPIT_MONITORING_COLLECTOR_SECRET: ${COCKPIT_COLLECTOR_SECRET:?COCKPIT_COLLECTOR_SECRET is required}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8100:8000"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    security_opt: [no-new-privileges:true]

  frontend:
    build:
      context: ./frontend
      target: development
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8100}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8100}
    command: pnpm dev --hostname 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3100:3000"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    security_opt: [no-new-privileges:true]

  collector:
    build:
      context: ./collector
      target: development
    environment:
      COCKPIT_COLLECTOR_ID: 22222222-2222-4222-8222-222222222222
      COCKPIT_ENVIRONMENT_ID: 11111111-1111-4111-8111-111111111111
      COCKPIT_COLLECTOR_SECRET: ${COCKPIT_COLLECTOR_SECRET:?COCKPIT_COLLECTOR_SECRET is required}
      COCKPIT_INGEST_URL: http://backend:8000
      COCKPIT_WEB_URL: https://pilot.plenora.nl/
      COCKPIT_HEALTH_URL: https://pilot.plenora.nl/health/
      COCKPIT_POLL_INTERVAL_SECONDS: 60
      PYTEST_ADDOPTS: -q -o cache_dir=/tmp/pytest-cache
      RUFF_CACHE_DIR: /tmp/ruff-cache
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./collector/fixtures/status.json:/backup/status.json:ro
      - cockpit_collector_state:/state
    healthcheck:
      test: [CMD, python, -c, "from pathlib import Path; import time; p=Path('/state/state.json'); raise SystemExit(0 if p.exists() and time.time()-p.stat().st_mtime < 180 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

volumes:
  cockpit_postgres_data:
  cockpit_collector_state:
