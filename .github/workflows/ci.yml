name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Ruff backend
        working-directory: backend
        run: python -m ruff check app tests
      - name: Ruff observer
        working-directory: observer
        run: python -m ruff check .
      - name: Ruff collector
        working-directory: collector
        run: python -m ruff check .
      - name: Test backend
        working-directory: backend
        run: python -m pytest
      - name: Test observer
        working-directory: observer
        env:
          PYTHONPATH: .:../collector
        run: python -m pytest
      - name: Test collector
        working-directory: collector
        run: python -m pytest
      - name: Test deployment contracts
        run: python -m unittest discover -s deploy/tests -p "test_*.py"
      - name: Test release deployment shell contracts
        run: |
          bash deploy/tests/test-init-env.sh
          bash deploy/tests/test-init-observer-env.sh
          bash deploy/tests/test-observer-directory-bind.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
      - name: Install pnpm
        run: npm install --global pnpm@11.9.0
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Lint frontend
        working-directory: frontend
        run: pnpm lint
      - name: Typecheck frontend
        working-directory: frontend
        run: pnpm typecheck
      - name: Test frontend
        working-directory: frontend
        run: pnpm test
      - name: Build frontend
        working-directory: frontend
        run: pnpm build
